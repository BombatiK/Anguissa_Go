<div class="login-container">
  <div class="login-card">
    
    <!-- En-tête avec Logo Anguissa Go -->
    <div class="logo-wrapper">
      <img src="/images/logo-anguissa-go.png" alt="Anguissa Go Logo" class="app-logo">
      <h1 class="app-title">Anguissa Staff</h1>
      <p class="app-subtitle">Portail d'Administration & Gestion</p>
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert-error">
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Formulaire de Connexion -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            placeholder="Entrez votre identifiant"
            [class.invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
          />
        </div>
        <small class="error-text" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')">
          L'identifiant est requis.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          />
        </div>
        <small class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Le mot de passe est requis.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="spinner">Connexion en cours...</span>
      </button>

    </form>

    <div class="login-footer">
      <p>© {{ currentYear }} Anguissa Go - Tous droits réservés</p>
    </div>

  </div>
</div>
